name: Release (TypeScript/npm)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/api-schema/**"
      - "packages/client-ts/**"
      - "pnpm-lock.yaml"

env:
  NODE_VERSION: 20.19.0
  PNPM_VERSION: 9.15.0

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    # Only run on main branch after merge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Verify build and tests pass before publishing
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:coverage

      # Enforce coverage threshold (vitest + summary file for release audit)
      - name: Verify coverage meets threshold
        run: |
          COVERAGE=$(jq '.total.lines.pct' apps/api/coverage/coverage-summary.json)
          MIN_COVERAGE=55
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% below $MIN_COVERAGE% minimum"
            echo "Coverage report: apps/api/coverage/index.html"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets $MIN_COVERAGE% threshold"

      # Check if there are changesets to release
      - run: pnpm changeset status --since=origin/main || echo "No changesets"

      # Publish with npm provenance (OIDC)
      # This requires npm 8.6+ and an OIDC token from GitHub Actions
      - run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          pnpm changeset publish --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Sign artifacts with cosign (if available)
      - name: Sign packages with cosign
        if: hashFiles('dist/**/*.tgz') != ''
        uses: sigstore/cosign-installer@v3
      # Note: Full cosign signing requires keyless OIDC integration with npm registry
      # For now, packages are signed with npm provenance (OIDC) which is built-in

      # Annotated tags require committer identity on the runner
      - name: Tag npm release on git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "release-ts-$(date +%Y%m%d-%H%M%S)" -m "npm release"
          git push origin main --tags
